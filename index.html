<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plants vs Zombies 2</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #121212; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 5px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }
        
        .game-title {
            font-size: 19px;
            font-weight: 900;
            background: linear-gradient(45deg, #00ff87, #60efff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0, 255, 135, 0.3);
            margin: 4px 0;
            letter-spacing: 1px;
            text-align: center;
        }

        #game-wrapper { 
            position: relative; 
            width: 100%; 
            max-width: 600px; 
            text-align: center; 
        }

        #game-container { 
            position: relative; 
            width: 100%; 
            height: 320px; 
            background: linear-gradient(to bottom, #4a7c36, #3b6329); 
            margin: 6px auto; 
            border: 4px solid #333; 
            overflow: hidden; 
            touch-action: manipulation; 
            border-radius: 10px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.5); 
        }

        .grid-cell { 
            position: absolute; 
            border: 1px dashed rgba(255,255,255,0.15); 
            box-sizing: border-box; 
        }

        .ui { 
            margin: 4px 0; 
            font-size: 12px; 
            font-weight: bold; 
            background: #1e1e1e; 
            padding: 8px; 
            border-radius: 6px; 
            width: 100%;
            border: 1px solid #333; 
            text-align: center; 
        }

        button { 
            padding: 6px 10px; 
            font-size: 12px; 
            background: linear-gradient(to bottom, #ffea61, #f1a80a); 
            border: none; 
            cursor: pointer; 
            border-radius: 5px; 
            font-weight: bold; 
            color: #222; 
            margin: 3px; 
            box-shadow: 0 3px #c68505; 
            touch-action: manipulation;
        }
        button:active { transform: translateY(2px); box-shadow: 0 1px #c68505; }
        button.active-btn { background: linear-gradient(to bottom, #ff5252, #c62828); color: white; }
        
        .entity { position: absolute; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .bullet { width: 8px; height: 8px; background: #fff200; border-radius: 50%; position: absolute; z-index: 3; box-shadow: 0 0 6px #ffcc00; pointer-events: none; }
        .sun-drop { position: absolute; font-size: 24px; cursor: pointer; z-index: 5; animation: bounce 0.6s infinite alternate; }
        
        /* Lật hướng xe cắt cỏ quay mặt sang phải */
        .lawnmower { position: absolute; font-size: 24px; z-index: 4; left: 4px; transform: scaleX(-1); pointer-events: none; }
        .active-mower { position: absolute; font-size: 26px; z-index: 6; transform: scaleX(-1); pointer-events: none; }
        
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-6px); } }
        
        .screen-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.92); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 20; 
            border-radius: 6px; 
            text-align: center; 
            padding: 15px;
        }
        .screen-overlay h1 { margin-bottom: 8px; font-size: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="game-title">🌱 PLANTS VS ZOMBIES 2 🧟</div>
    <div id="game-wrapper">
        <div class="ui">
            ☀️ <span id="sun-count" style="color: #ffeb3b;">100</span> | Màn: <span id="level-display" style="color: #00ffff;">1</span> | Mục tiêu: <span id="score-count" style="color: #00e676;">0</span>/<span id="target-count">10</span><br>
            <button onclick="selectPlant('peashooter')" ontouchend="selectPlant('peashooter'); event.preventDefault();" id="btn-peashooter">🌿 Đậu (50)</button>
            <button onclick="selectPlant('sunflower')" ontouchend="selectPlant('sunflower'); event.preventDefault();" id="btn-sunflower">🌻 Hoa (40)</button>
            <button onclick="selectPlant('wallnut')" ontouchend="selectPlant('wallnut'); event.preventDefault();" id="btn-wallnut">🥔 Khoai (30)</button>
            <button onclick="selectPlant('cherry')" ontouchend="selectPlant('cherry'); event.preventDefault();" id="btn-cherry">💣 Bom (125)</button>
            <button onclick="selectPlant('shovel')" ontouchend="selectPlant('shovel'); event.preventDefault();" id="btn-shovel">⛏️ Xẻng</button>
        </div>
        <div id="game-container" onclick="handleGridClick(event)" ontouchend="handleTouchGrid(event)">
            <!-- Menu Chọn Màn -->
            <div id="menu-screen" class="screen-overlay">
                <h1 style="color: #4CAF50;">CHỌN MÀN CHƠI</h1>
                <p style="font-size: 12px; color: #ccc; margin-bottom: 12px;">Full màn hình & Xe cắt cỏ hướng sang phải!</p>
                <button onclick="startGame(1)" ontouchend="startGame(1); event.preventDefault();" style="background: linear-gradient(to bottom, #66bb6a, #388e3c); color: white; font-size: 14px; padding: 8px 18px; margin: 4px;">MÀN 1: DỄ (10 Zombie)</button>
                <button onclick="startGame(2)" ontouchend="startGame(2); event.preventDefault();" style="background: linear-gradient(to bottom, #ffa726, #f57c00); color: white; font-size: 14px; padding: 8px 18px; margin: 4px;">MÀN 2: KHÓ (Zombie giáp)</button>
            </div>

            <!-- Màn hình Game Over -->
            <div id="gameover-screen" class="screen-overlay hidden">
                <h1 style="color: #ff5252;">GAME OVER</h1>
                <p style="font-size: 12px; color: #ccc; margin-bottom: 12px;">Xe cắt cỏ đã hết & Zombie đã vào nhà!</p>
                <button onclick="showMenu()" ontouchend="showMenu(); event.preventDefault();" style="background: linear-gradient(to bottom, #ff5252, #c62828); color: white; padding: 6px 16px;">VỀ MENU</button>
            </div>

            <!-- Màn hình Chiến Thắng -->
            <div id="win-screen" class="screen-overlay hidden">
                <h1 style="color: #00e676;">CHIẾN THẮNG! 🎉</h1>
                <p style="font-size: 12px; color: #ccc; margin-bottom: 12px;">Bảo vệ thành công khu vườn xuất sắc!</p>
                <canvas id="fireworks-canvas" width="600" height="320" style="position: absolute; top:0; left:0; pointer-events:none; z-index:21; width:100%; height:100%;"></canvas>
                <button onclick="showMenu()" ontouchend="showMenu(); event.preventDefault();" style="z-index: 22; position: relative; padding: 6px 16px;">VỀ MENU</button>
            </div>
        </div>
        <div style="font-size: 11px; color: #888; margin-top: 5px; text-align: center;">Chơi mượt mà trên Mobile & PC</div>
    </div>

    <script>
        let audioCtx = null;
        let lastBiteSoundTime = 0;
        let bgmTimer = null;

        function initAudio() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {}
        }

        function startBGM() {
            if (bgmTimer) clearInterval(bgmTimer);
            const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 523.25];
            bgmTimer = setInterval(() => {
                if (!gameStarted || gameOver || gameWon) return;
                try {
                    initAudio();
                    if(!audioCtx) return;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    let note = notes[Math.floor(Math.random() * notes.length)];
                    osc.frequency.setValueAtTime(note, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } catch(e) {}
            }, 800);
        }

        function playSound(type) {
            try {
                initAudio();
                if(!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                if(type === 'plant') {
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if(type === 'shoot') {
                    osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.08);
                } else if(type === 'hit') {
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.08);
                } else if(type === 'collect') {
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
