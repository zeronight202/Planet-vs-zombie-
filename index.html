<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plants vs Zombies 2</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #121212; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }
        
        .game-title {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(45deg, #00ff87, #60efff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0, 255, 135, 0.3);
            margin: 8px 0;
            letter-spacing: 1px;
            text-align: center;
        }

        #game-wrapper { 
            position: relative; 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
        }

        #game-container { 
            position: relative; 
            width: 100%; 
            height: 280px; 
            background: linear-gradient(to bottom, #4a7c36, #3b6329); 
            margin: 6px auto; 
            border: 4px solid #333; 
            overflow: hidden; 
            touch-action: manipulation; 
            border-radius: 10px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.5); 
        }

        .grid-cell { 
            position: absolute; 
            width: 12.5%; 
            height: 20%; 
            border: 1px dashed rgba(255,255,255,0.15); 
            box-sizing: border-box; 
        }

        .ui { 
            margin: 6px 0; 
            font-size: 12px; 
            font-weight: bold; 
            background: #1e1e1e; 
            padding: 8px; 
            border-radius: 6px; 
            width: 100%;
            border: 1px solid #333; 
            text-align: center; 
        }

        button { 
            padding: 6px 10px; 
            font-size: 11px; 
            background: linear-gradient(to bottom, #ffea61, #f1a80a); 
            border: none; 
            cursor: pointer; 
            border-radius: 5px; 
            font-weight: bold; 
            color: #222; 
            margin: 2px; 
            box-shadow: 0 3px #c68505; 
        }
        button:active { transform: translateY(2px); box-shadow: 0 1px #c68505; }
        
        .entity { position: absolute; display: flex; align-items: center; justify-content: center; }
        .bullet { width: 7px; height: 7px; background: #fff200; border-radius: 50%; position: absolute; z-index: 3; box-shadow: 0 0 6px #ffcc00; }
        
        .screen-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.92); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 20; 
            border-radius: 6px; 
            text-align: center; 
            padding: 15px;
        }
        .screen-overlay h1 { margin-bottom: 8px; font-size: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="game-title">🌱 PLANTS VS ZOMBIES 2 🧟</div>
    <div id="game-wrapper">
        <div class="ui">
            ☀️ <span id="sun-count" style="color: #ffeb3b;">100</span> | Màn: <span id="level-display" style="color: #00ffff;">1</span> | Mục tiêu: <span id="score-count" style="color: #00e676;">0</span>/<span id="target-count">10</span><br>
            <button onclick="selectPlant('peashooter')">🌿 Đậu (50☀️)</button>
            <button onclick="selectPlant('sunflower')">🌻 Hướng Dương (40☀️)</button>
            <button onclick="selectPlant('wallnut')">🥔 Khoai Tây (30☀️)</button>
        </div>
        <div id="game-container" onclick="handleGridClick(event)">
            <!-- Menu Chọn Màn -->
            <div id="menu-screen" class="screen-overlay">
                <h1 style="color: #4CAF50;">CHỌN MÀN CHƠI</h1>
                <p style="font-size: 12px; color: #ccc; margin-bottom: 12px;">Bảo vệ khu vườn và tiêu diệt zombie!</p>
                <button onclick="startGame(1)" style="background: linear-gradient(to bottom, #66bb6a, #388e3c); color: white; font-size: 14px; padding: 8px 18px; margin: 4px;">MÀN 1: DỄ (10 Zombie)</button>
                <button onclick="startGame(2)" style="background: linear-gradient(to bottom, #ffa726, #f57c00); color: white; font-size: 14px; padding: 8px 18px; margin: 4px;">MÀN 2: KHÓ (Zombie giáp)</button>
            </div>

            <!-- Màn hình Game Over -->
            <div id="gameover-screen" class="screen-overlay hidden">
                <h1 style="color: #ff5252;">GAME OVER</h1>
                <p style="font-size: 12px; color: #ccc; margin-bottom: 12px;">Zombie đã phá vỡ hàng phòng thủ!</p>
                <button onclick="showMenu()" style="background: linear-gradient(to bottom, #ff5252, #c62828); color: white;">VỀ MENU</button>
            </div>

            <!-- Màn hình Chiến Thắng -->
            <div id="win-screen" class="screen-overlay hidden">
                <h1 style="color: #00e676;">CHIẾN THẮNG! 🎉</h1>
                <p style="font-size: 12px; color: #ccc; margin-bottom: 12px;">Bảo vệ thành công khu vườn xuất sắc!</p>
                <canvas id="fireworks-canvas" width="420" height="280" style="position: absolute; top:0; left:0; pointer-events:none; z-index:21; width:100%; height:100%;"></canvas>
                <button onclick="showMenu()" style="z-index: 22; position: relative;">VỀ MENU</button>
            </div>
        </div>
        <div style="font-size: 11px; color: #888; margin-top: 5px; text-align: center;">Chơi mượt mà trên Mobile & PC</div>
    </div>

    <script>
        let audioCtx = null;
        function initAudio() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {}
        }

        function playSound(type) {
            try {
                initAudio();
                if(!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                if(type === 'plant') {
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if(type === 'shoot') {
                    osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.08);
                } else if(type === 'hit') {
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.08);
                }
            } catch(e) {}
        }

        let gameStarted = false;
        let gameOver = false;
        let gameWon = false;
        let currentLevel = 1;
        let targetScore = 10;
        let suns = 100;
        let score = 0;
        let selectedType = null; 
        const gridRows = 5;
        const gridCols = 8;

        let plants = []; 
        let zombies = []; 
        let bullets = []; 
        
        let lastTime = 0;
        let animationFrameId = null;
        let zombieSpawner = null;
        let sunSpawner = null;

        const container = document.getElementById('game-container');
        const menuScreen = document.getElementById('menu-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const winScreen = document.getElementById('win-screen');

        for(let r=0; r<gridRows; r++) {
            for(let c=0; c<gridCols; c++) {
                let div = document.createElement('div');
                div.className = 'grid-cell';
                div.style.left = (c * 12.5) + '%';
                div.style.top = (r * 20) + '%';
                container.appendChild(div);
            }
        }

        function showMenu() {
            gameoverScreen.classList.add('hidden');
            winScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
            gameStarted = false;
            stopFireworks();
        }

        function startGame(level) {
            initAudio(); 
            currentLevel = level;
            targetScore = (level === 1) ? 10 : 15;
            document.getElementById('level-display').innerText = currentLevel;
            document.getElementById('target-count').innerText = targetScore;

            menuScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            winScreen.classList.add('hidden');
            
            gameStarted = true;
            gameOver = false;
            gameWon = false;
            suns = 100;
            score = 0;
            plants = [];
            zombies = [];
            bullets = [];
            selectedType = null;
            document.getElementById('sun-count').innerText = suns;
            document.getElementById('score-count').innerText = score;

            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            if(zombieSpawner) clearInterval(zombieSpawner);
            if(sunSpawner) clearInterval(sunSpawner);

            let spawnRate = (currentLevel === 1) ? 4000 : 3000;
            zombieSpawner = setInterval(() => {
                if(!gameStarted || gameOver || gameWon) return;
                let row = Math.floor(Math.random() * gridRows);
                let isConehead = (currentLevel === 2 && Math.random() < 0.4);
                zombies.push({
                    row: row, 
                    x: container.clientWidth, 
                    hp: isConehead ? 140 : 60, 
                    maxHp: isConehead ? 140 : 60,
                    isConehead: isConehead
                });
            }, spawnRate);

            sunSpawner = setInterval(() => {
                if(!gameStarted || gameOver || gameWon) return;
                suns += 25;
                document.getElementById('sun-count').innerText = suns;
            }, 7000);

            lastTime = performance.now();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function triggerGameOver() {
            gameOver = true;
            gameStarted = false;
            cancelAnimationFrame(animationFrameId);
            clearInterval(zombieSpawner);
            clearInterval(sunSpawner);
            gameoverScreen.classList.remove('hidden');
        }

        function triggerWin() {
            gameWon = true;
            gameStarted = false;
            cancelAnimationFrame(animationFrameId);
            clearInterval(zombieSpawner);
            clearInterval(sunSpawner);
            winScreen.classList.remove('hidden');
            startFireworks();
        }

        function selectPlant(type) {
            if(!gameStarted || gameOver || gameWon) return;
            if(type === 'peashooter' && suns >= 50) { selectedType = 'peashooter'; alert("Đã chọn Đậu (🌿)"); }
            else if(type === 'sunflower' && suns >= 40) { selectedType = 'sunflower'; alert("Đã chọn Hướng Dương (🌻)"); }
            else if(type === 'wallnut' && suns >= 30) { selectedType = 'wallnut'; alert("Đã chọn Khoai Tây (🥔)"); }
            else { alert("Không đủ mặt trời hoặc chọn sai!"); }
        }

        function handleGridClick(e) {
            if(!gameStarted || gameOver || gameWon || !selectedType) return;
            let rect = container.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            
            let col = Math.floor((x / rect.width) * gridCols);
            let row = Math.floor((y / rect.height) * gridRows);

            if(row >= 0 && row < gridRows && col >= 0 && col < gridCols) {
                let exists = plants.some(p => p.row === row && p.col === col);
                if(!exists) {
                    playSound('plant');
                    if(selectedType === 'peashooter') {
                        plants.push({type: 'peashooter', row: row, col: col, hp: 100, shootTimer: 0});
                        suns -= 50;
                    } else if(selectedType === 'sunflower') {
                        plants.push({type: 'sunflower', row: row, col: col, hp: 80, sunTimer: 0});
                        suns -= 40;
                    } else if(selectedType === 'wallnut') {
                        plants.push({type: 'wallnut', row: row, col: col, hp: 300});
                        suns -= 30;
                    }
                    document.getElementById('sun-count').innerText = suns;
                    selectedType = null;
                }
            }
        }

        function gameLoop(timestamp) {
            if(!gameStarted || gameOver || gameWon) return;
            let dt = (timestamp - lastTime) / 16.67;
            if(dt > 3) dt = 3;
            lastTime = timestamp;

            let cWidth = container.clientWidth;
            let cellW = cWidth / gridCols;

            bullets.forEach(b => b.x += 3.5 * dt);
            bullets = bullets.filter(b => b.x < cWidth);

            zombies.forEach(z => {
                let hitPlant = plants.find(p => p.row === z.row && Math.abs((p.col * cellW) - z.x) < cellW * 0.5);
                if(hitPlant) {
                    hitPlant.hp -= 1.0 * dt;
                    if(hitPlant.hp <= 0) {
                        plants = plants.filter(p => p !== hitPlant);
                    }
                } else {
                    let speed = z.isConehead ? 0.35 : 0.5;
                    z.x -= speed * dt;
                }
            });

            plants.forEach(p => {
                let pX = p.col * cellW;
                if(p.type === 'peashooter') {
                    let hasZombie = zombies.some(z => z.row === p.row && z.x > pX);
                    if(hasZombie) {
                        p.shootTimer += dt;
                        if(p.shootTimer > 45) {
                            bullets.push({row: p.row, x: pX + cellW});
                            playSound('shoot');
                            p.shootTimer = 0;
                        }
                    }
                } else if(p.type === 'sunflower') {
                    p.sunTimer += dt;
                    if(p.sunTimer > 180) {
                        suns += 15;
                        document.getElementById('sun-count').innerText = suns;
                        p.sunTimer = 0;
                    }
                }
            });

            bullets.forEach((b, bi) => {
                zombies.forEach((z, zi) => {
                    if(b.row === z.row && Math.abs(b.x - z.x) < cellW * 0.4) {
                        z.hp -= 20;
                        playSound('hit');
                        bullets.splice(bi, 1);
                        if(z.hp <= 0) {
                            zombies.splice(zi, 1);
                            score++;
                            document.getElementById('score-count').innerText = score;
                            if(score >= targetScore) {
                                triggerWin();
                            }
                        }
                    }
                });
            });

            zombies.forEach(z => {
                if(z.x < -20) {
                    triggerGameOver();
                }
            });

            render();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function render() {
            container.querySelectorAll('.entity:not(.grid-cell), .bullet').forEach(el => el.remove());

            let cWidth = container.clientWidth;
            let cHeight = container.clientHeight;
            let cellW = cWidth / gridCols;
            let cellH = cHeight / gridRows;

            plants.forEach(p => {
                let div = document.createElement('div');
                div.className = 'entity';
                div.style.position = 'absolute';
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                div.style.justifyContent = 'center';
                div.style.left = (p.col * cellW) + 'px';
                div.style.top = (p.row * cellH) + 'px';
                div.style.width = cellW + 'px';
                div.style.height = cellH + 'px';
                div.style.fontSize = '24px';
                div.style.zIndex = '2';
                if(p.type === 'peashooter') div.innerText = '🌿';
                else if(p.type === 'sunflower') div.innerText = '🌻';
                else if(p.type === 'wallnut') div.innerText = '🥔';
                container.appendChild(div);
            });

            zombies.forEach(z => {
                let div = document.createElement('div');
                div.className = 'entity';
                div.style.position = 'absolute';
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                div.style.justifyContent = 'center';
                div.style.left = z.x + 'px';
                div.style.top = (z.row * cellH) + 'px';
                div.style.width = cellW + 'px';
                div.style.height = cellH + 'px';
                div.style.fontSize = '24px';
                div.style.zIndex = '2';
                div.innerText = z.isConehead ? '🧟‍♂️' : '🧟';
                container.appendChild(div);
            });

            bullets.forEach(b => {
                let div = document.createElement('div');
                div.className = 'bullet';
                div.style.left = b.x + 'px';
                div.style.top = (b.row * cellH + cellH * 0.4) + 'px';
                container.appendChild(div);
            });
        }

        let fwInterval = null;
        function startFireworks() {
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];

            fwInterval = setInterval(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if(Math.random() < 0.3) {
                    let fx = Math.random() * canvas.width;
                    let fy = Math.random() * (canvas.height / 2);
                    let color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    for(let i=0; i<30; i++) {
                        let angle = Math.random() * Math.PI * 2;
                        let speed = Math.random() * 4 + 1;
                        particles.push({ x: fx, y: fy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, alpha: 1, color: color });
                    }
                }
                particles.forEach((p, index) => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.alpha -= 0.02;
                    ctx.save();
                    ctx.globalAlpha = Math.max(p.alpha, 0);
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                    if(p.alpha <= 0) particles.splice(index, 1);
                });
            }, 30);
        }

        function stopFireworks() {
            if(fwInterval) clearInterval(fwInterval);
            const canvas = document.getElementById('fireworks-canvas');
            if(canvas) {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
    </script>
</body>
</html>
